databaseChangeLog:
  - changeSet:
      id: 0001_create_user_account
      author: classmate
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            schemaName: cmsa
            tableName: user_account
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: auth_provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: user_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: encrypted_password
                  type: VARCHAR(200)
              - column:
                  name: display_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: birthdate
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(150)
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  constraints:
                    nullable: false
                  name: rec_version
                  type: BIGINT
        - addUniqueConstraint:
            schemaName: cmsa
            tableName: user_account
            columnNames: email
            constraintName: uq_user_email
        - createIndex:
            schemaName: cmsa
            tableName: user_account
            indexName: ix_user_account_01
            unique: true
            columns:
              - column:
                  name: auth_provider
              - column:
                  name: user_name
        - createIndex:
            schemaName: cmsa
            tableName: user_account
            indexName: ix_user_account_02
            unique: true
            columns:
              - column:
                  name: email
