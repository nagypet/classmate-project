databaseChangeLog:
  - changeSet:
      id: 0003_create_useraccount_x_role
      author: classmate
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            schemaName: cmsa
            tableName: useraccount_x_role
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
        - addPrimaryKey:
            schemaName: cmsa
            tableName: useraccount_x_role
            columnNames: user_id, role_id
            constraintName: ix_useraccount_x_role_01
        - addForeignKeyConstraint:
            baseTableSchemaName: cmsa
            baseTableName: useraccount_x_role
            baseColumnNames: user_id
            referencedTableSchemaName: cmsa
            referencedTableName: user_account
            referencedColumnNames: id
            constraintName: fk_useraccount_x_role_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: cmsa
            baseTableName: useraccount_x_role
            baseColumnNames: role_id
            referencedTableSchemaName: cmsa
            referencedTableName: role
            referencedColumnNames: id
            constraintName: fk_useraccount_x_role_role
            onDelete: CASCADE
