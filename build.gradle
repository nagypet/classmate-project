plugins {
	alias libs.plugins.sonarqube apply false
	alias libs.plugins.ben.manes.versions
}

def trustStorePath = rootProject.file("gradle/gradle-truststore.jks").absolutePath
System.setProperty("javax.net.ssl.trustStore", trustStorePath)
System.setProperty("javax.net.ssl.trustStorePassword", "changeit")
System.setProperty("jakarta.net.ssl.trustStore", trustStorePath)
System.setProperty("jakarta.net.ssl.trustStorePassword", "changeit")

subprojects {
    apply plugin: 'org.sonarqube'
    sonarqube {
        properties {
            property "sonar.projectName", "${project.name}"
            property "sonar.host.url", "${sonarServer}"
            //property "sonar.branch.name", "master"
            property "sonar.exclusions", "**/generated*/**"
        }
    }
}
