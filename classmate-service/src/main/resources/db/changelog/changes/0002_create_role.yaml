databaseChangeLog:
  - changeSet:
      id: 0002_create_role
      author: classmate
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            schemaName: cmsa
            tableName: role
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: cmsa
            tableName: role
            indexName: ix_role_01
            unique: true
            columns:
              - column:
                  name: role
  - changeSet:
      id: 0002_insert_roles
      author: classmate
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - insert:
            schemaName: cmsa
            tableName: role
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: role
                  value: "10"
        - insert:
            schemaName: cmsa
            tableName: role
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: role
                  value: "20"
        - insert:
            schemaName: cmsa
            tableName: role
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: role
                  value: "30"
