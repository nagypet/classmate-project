<div responsiveClass="login-form-container">
  <img responsiveClass="logo" src="{{getLogoUrl()}}">
  <div responsiveClass="login-form">
    <div responsiveClass="login-panel">
      <div responsiveClass="system-name">ClassMate Regisztráció</div>
      <ngface-form [formdata]="formData">
        <ngface-text-input [formdata]="formData" [focused]=true widgetid="display-name"/>
        <ngface-text-input [formdata]="formData" widgetid="email"/>
        <ngface-select [formdata]="formData" widgetid="gender"/>
        <ngface-date-input [formdata]="formData" widgetid="birthdate"/>
        <div responsiveClass="logon-error">{{ errorText }}</div>
        <div responsiveClass="ngface-dialog-actions">
          <ngface-button [formdata]="formData" widgetid="button-register" (click)="onRegister()"/>
        </div>
      </ngface-form>
    </div>
  </div>
</div>
