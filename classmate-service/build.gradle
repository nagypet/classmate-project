plugins {
    alias libs.plugins.org.springframework.boot
    alias libs.plugins.io.spring.dependency.management
    id 'application'
    id 'jacoco'
    alias libs.plugins.habarta.typescript.generator
}

ext {
    imagePrefix = 'classmate'
    //dockerRegistry = 'docker-registry:5000'
    //dockerRegistry = 'docker.io/petyaba'
}

apply from: '../gradle/common.gradle'
apply from: '../gradle/docker.gradle'


repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = "../gradle/localrepo"
    }
}


application {
    mainClass = 'hu.perit.classmate.ClassMateApplication'
    // Some JVM options already set in common.gradle
    applicationDefaultJvmArgs += ['-Xmx2g', '-Xms32m']
}


dependencies {
    //implementation platform(libs.spvitamin)
    implementation platform(libs.spring.cloud)

    // -----------------------------------------------------------------------------------------------------------------
    // Compile dependencies
    // -----------------------------------------------------------------------------------------------------------------
    // spvitamin as subproject
    implementation project(':spvitamin-core')
    implementation project(':spvitamin-json-time')
    implementation project(':spvitamin-spring-admin')
    implementation project(':spvitamin-spring-general')
    implementation project(':spvitamin-spring-logging')
    implementation project(':spvitamin-spring-security')
    implementation project(':spvitamin-spring-security-oauth2')
    implementation project(':spvitamin-spring-server')
    implementation project(':spvitamin-spring-data')
    implementation project(':spvitamin-spring-cloud-feign')

    // ngface as subproject
    implementation project(':ngface-core')
    implementation project(':ngface-rest')
    implementation project(':ngface-data-jpa')

    // Lombok
    compileOnly libs.lombok
    testCompileOnly libs.lombok
    integtestCompileOnly libs.lombok
    annotationProcessor libs.lombok
    testAnnotationProcessor libs.lombok
    integtestAnnotationProcessor libs.lombok

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-config'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    //implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.session:spring-session-core'

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.openfeign:feign-jackson'

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    // Micrometer tracing
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'

    // JJWT
    implementation libs.bundles.jsonwebtoken

    // Swagger
    implementation libs.openapi.ui
    implementation libs.openapi.api

    // apache.commons
    implementation libs.commons.lang3

    // Liquibase
    implementation libs.liquibase.core

    // Mapstruct
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor


    //------------------------------------------------------------------------------------------------------------------
    // Runtime dependencies
    //------------------------------------------------------------------------------------------------------------------
    // Logging in json format
    runtimeOnly libs.logstash.logback.encoder

    // Micrometer Prometheus plugin
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    //runtimeOnly libs.mssql.jdbc
    runtimeOnly 'org.postgresql:postgresql'
    //runtimeOnly 'com.h2database:h2'


    //------------------------------------------------------------------------------------------------------------------
    // Test dependencies
    //------------------------------------------------------------------------------------------------------------------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':spvitamin-test')
    // Enable Mockito constructor and static mocking in unit tests
    testImplementation libs.mockito.inline
    testRuntimeOnly libs.junit.platform.launcher
}


tasks.named('test') {
    useJUnitPlatform()
}


dockerImage() {
    dependsOn 'dockerBackendImage'
}

import cz.habarta.typescript.generator.JsonLibrary
import cz.habarta.typescript.generator.OptionalProperties
import cz.habarta.typescript.generator.OptionalPropertiesDeclaration
import cz.habarta.typescript.generator.TypeScriptFileType
import cz.habarta.typescript.generator.TypeScriptOutputKind

generateTypeScript {
    jsonLibrary = JsonLibrary.jackson3
    classPatterns = [
            'hu.perit.classmate.rest.model.**'
    ]
    customTypeNaming = [
    ]
    outputFile = 'build/classmate-service-models.ts'
    outputFileType = TypeScriptFileType.implementationFile
    outputKind = TypeScriptOutputKind.module
    namespace = 'ClassMateService'
    //disableTaggedUnions = true
    optionalProperties = OptionalProperties.useSpecifiedAnnotations
    optionalAnnotations = [
            'javax.annotation.Nullable',
            'jakarta.annotation.Nullable',
    ]
    optionalPropertiesDeclaration = OptionalPropertiesDeclaration.nullableType
    disableTaggedUnions = true
}
